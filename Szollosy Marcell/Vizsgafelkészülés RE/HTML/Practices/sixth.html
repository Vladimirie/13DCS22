<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulátor</title>
</head>
<body>

   
    <form oninput="number.value=parseInt(number1.value)+parseInt(number2.value)">
    <input type="number" id="number1" name="Number" required><br><br>

    <input type="number" id="number2" name="Number" required><br><br>

    <output type="number" id="number" name="Output"></output>

        
    </form>
</body>
</html>
