<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <title>Személyek adatok</title>
    <style>
        .container {
            width: 500px;
            margin: 50px auto;
            padding: 20px;
            border: 2px solid #ccc;
            border-radius: 10px;
            background-color: #f9f9f9;
        }

        label {
            display: block;
            margin-top: 10px;
        }

        input,
        select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Személyek adatai</h2>
        <label for="nev">Név:</label>
        <select id="nev" onchange="loadData()">
            <option value="">Válassz nevet...</option>
        </select>

        <label for="email">Email:</label>
        <input type="text" id="email" readonly>

        <label for="telefon">Telefon:</label>
        <input type="text" id="telefon" readonly>

        <label for="anyja_neve">Anyja neve:</label>
        <input type="text" id="anyja_neve" readonly>

        <label for="igazolvany_szam">Igazolvány szám:</label>
        <input type="text" id="igazolvany_szam" readonly>
    </div>

    <script>
        // Fetch API használatával nevek lekérése
        function loadNames() {
            fetch('get_names.php')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Hálózati hiba történt');
                    }
                    return response.json();
                })
                .then(names => {
                    const select = document.getElementById("nev");
                    select.innerHTML = "<option value=''>Válassz nevet...</option>";
                    names.forEach(name => {
                        const option = document.createElement("option");
                        option.value = name.id;
                        option.textContent = name.nev;
                        select.appendChild(option);
                    });
                })
                .catch(error => {
                    console.error('Hiba a nevek betöltésekor:', error);
                });
        }

        // Fetch API használatával személy adatainak lekérése
        function loadData() {
    const id = document.getElementById('nev').value;
    if (!id) return;
    
    fetch(`get_data.php?id=${id}`)
    .then(response => {
        if (!response.ok) throw new Error('Hálózati hiba történt');
        return response.json();
    })
    .then(data => {
        document.getElementById('email').value = data.data.email;
        document.getElementById('telefon').value = data.data.telefon;
        document.getElementById('anyja_neve').value = data.data.anyja_neve;
        document.getElementById('igazolvany_szam').value = data.data.igazolvany_szam;
        
        // Sikeres üzenet egy sorban
        let uzenetDiv = document.getElementById('uzenet');
        if (!uzenetDiv) {
            uzenetDiv = document.createElement('div');
            uzenetDiv.id = 'uzenet';
            document.querySelector('.container').insertBefore(uzenetDiv, document.querySelector('label[for="nev"]'));
        }
        uzenetDiv.style.cssText = 'background: #d4edda; color: #155724; padding: 10px; margin: 10px 0; border-radius: 5px; font-weight: bold;';
        uzenetDiv.textContent = data.message; // "sikeres adatátvitel"
    })
    .catch(error => {
        console.error('Hiba az adatok betöltésekor:', error);
    });
}


        // Az oldal betöltésekor betölti a neveket
        window.onload = loadNames;
    </script>
</body>

</html>
