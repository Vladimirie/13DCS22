<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Hiányzás Analizátor</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        table {
            border-collapse: collapse;
            margin-top: 15px;
            width: 100%;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 6px;
            text-align: left;
        }
        .ok {
            color: green;
            font-weight: bold;
        }
        .hiba {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>

<h1>Hiányzás Analizátor</h1>

<form id="szuroForm">
    <label>
        Minimális igazolatlan hiányzás:
        <input type="number" id="minIgazolatlan" value="0">
    </label>

    <label>
        Tantárgy:
        <select id="tantargySzuro">
            <option value="">Összes</option>
        </select>
    </label>

    <button type="submit">Szűrés</button>
</form>

<div id="limitEllenorzes"></div>
<div id="eredmenyek"></div>

<script src="script.js"></script>
</body>
</html>
