<!DOCTYPE html> 
<html lang="hu"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>AJAX Lépcsőzetes Listák</title> 
    <style>         body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;             background-color: #f4f7f6; 
            margin: 0;             padding: 20px;             display: flex;             justify-content: center;             align-items: flex-start; 
            min-height: 100vh; 
        } 
        .container { 
            background-color: #ffffff;             padding: 40px;             border-radius: 12px; 
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);             width: 100%;             max-width: 600px;              box-sizing: border-box; 
            margin-top: 50px; 
        } 
        h1 { color: #333; text-align: center; margin-bottom: 30px; font-size: 1.8em; } 
        .select-group { margin-bottom: 20px; } 
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #555; font-size: 0.95em; }         select {             width: 100%;             padding: 10px 15px;             border: 1px solid #ccc;             border-radius: 6px;             box-sizing: border-box; 
            transition: border-color 0.3s, box-shadow 0.3s; 
        } 
        select:focus {             border-color: #007bff; 
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.25);             outline: none; 
        } 
    </style> 
</head> 
<body> 
 
    <div class="container"> 
        <h1> Lépcsőzetes Területválasztó</h1> 
 
        <div class="select-group"> 
            <label for="country">1. Ország kiválasztása:</label> 
            <select id="country" onchange="loadStates(this.value)"></select> 
        </div> 
 
        <div class="select-group"> 
            <label for="state">2. Megye / Állam kiválasztása:</label> 
            <select id="state" onchange="loadStreets(this.value)"></select>         </div> 
 
        <div class="select-group"> 
            <label for="street">3. Utca / Helyszín kiválasztása:</label> 
            <select id="street"></select> 
        </div> 
    </div> 
 
    <script> 
        const countrySelect = document.getElementById('country');         const stateSelect = document.getElementById('state');         const streetSelect = document.getElementById('street'); 
 
        function populateSelect(selectElement, data, defaultText) { 
            selectElement.innerHTML = `<option value="">${defaultText}</option>`; 
             
            // Hibakezelés a data.forEach-re             if (!Array.isArray(data)) { 
                 selectElement.innerHTML = `<option value="">Hiba a betöltéskor!</option>`;                  return; 
            } 
 
            data.forEach(item => { 
                const option = document.createElement('option'); 
                option.value = item.id;                 option.textContent = item.name; 
                selectElement.appendChild(option); 
            }); 
         
 
        async function loadCountries() { 
            try { 
                const response = await fetch('get_countries.php');                  const countries = await response.json(); 
                 
                populateSelect(countrySelect, countries, 'Válassz országot...'); 
                 
                populateSelect(stateSelect, [], 'Válassz megyét/államot...');                 populateSelect(streetSelect, [], 'Válassz utcát...'); 
            } catch (error) { 
                console.error("Hiba az országok betöltésekor:", error);                 alert("Hálózati hiba történt. Ellenőrizd a PHP szervert."); 
            } 
        } 
 
        async function loadStates(countryId) {             populateSelect(stateSelect, [], 'Betöltés...');             populateSelect(streetSelect, [], 'Válassz utcát...'); 
 
            if (!countryId) { 
                populateSelect(stateSelect, [], 'Válassz megyét/államot...');                 return; 
            } 
 
            try { 
                const response = await fetch(`get_states.php?country_id=${countryId}`);                 const states = await response.json(); 
                populateSelect(stateSelect, states, 'Válassz megyét/államot...'); 
            } catch (error) { 
                console.error("Hiba a megyék betöltésekor:", error);                 populateSelect(stateSelect, [], 'Hiba a betöltéskor.'); 
            } 
        } 
 
        async function loadStreets(stateId) { 
            populateSelect(streetSelect, [], 'Betöltés...'); 
 
            if (!stateId) { 
                populateSelect(streetSelect, [], 'Válassz utcát...');                 return; 
            }                          try { 
                const response = await fetch(`get_streets.php?state_id=${stateId}`);                 const streets = await response.json(); 
                populateSelect(streetSelect, streets, 'Válassz utcát...'); 
            } catch (error) { 
                console.error("Hiba az utcák betöltésekor:", error);                 populateSelect(streetSelect, [], 'Hiba a betöltéskor.'); 
            } 
        } 
 
        window.onload = loadCountries; 
    </script> 
 
</body> 
</html>
