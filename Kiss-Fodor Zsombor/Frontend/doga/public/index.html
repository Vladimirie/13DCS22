<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Autók kezelése</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h2>Autók listája</h2>

<!-- Módosító űrlap -->
<form id="carForm">
    <input type="hidden" id="carId">

    <label>Rendszám:</label>
    <input type="text" id="licensePlate" required><br><br>

    <label>Márka:</label>
    <input type="text" id="brand" required><br><br>

    <label>Modell:</label>
    <input type="text" id="model" required><br><br>

    <button type="submit">Mentés</button>
</form>

<br><br>

<table>
    <thead>
        <tr>
            <th>Rendszám</th>
            <th>Márka</th>
            <th>Modell</th>
            <th>ÉVjárat</th>
            <th>Műveletek</th>
        </tr>
    </thead>
    <tbody id="autoTabla">
    </tbody>
</table>

<script src="script.js"></script>
</body>
</html>
