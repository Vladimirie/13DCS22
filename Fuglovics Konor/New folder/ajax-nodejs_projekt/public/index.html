<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<link rel="stylesheet" href="./css/style.css">
	<title>Document</title>
</head>
<body>
	<h1 class="head">Car database</h1>
	<div class="card">
		<h2>View and edit cars</h3>
		<select id="cars">
		</select>
		<div class="forminput">
			<input type="hidden" id="edit_id">
			<input type="text" id="f_licenseplate" placeholder="Rendszám" readonly>
			<input type="text" id="f_brand" placeholder="Márka" readonly>
			<input type="text" id="f_model" placeholder="Modell" readonly>
		</div>
		<div>
			<button type="button" id="refresh_table">Refresh</button>
			<button type="button" id="save">Save</button>
			<button type="button" id="clear">Clear</button>
		</div>
	</div>
	<div class="card">
		<table>
			<thead>
				<tr>
					<th>Rendszám</th>
					<th>Márka</th>
					<th>Modell</th>
					<th>Műveletek</th>
				</tr>
			</thead>
			<tbody id="datatable"></tbody>
		</table>
	</div>
	<script src="./js/script.js"></script>
</body>
</html>
