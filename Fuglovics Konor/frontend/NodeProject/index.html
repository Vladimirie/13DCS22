<!DOCTYPE html>
<html lang="hu">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Személyek CRUD - Adatbázis</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="container">
    <header>
      <h1>👥 Személyek Nyilvántartás</h1>
      <p>Node.js + Adatbázis API</p>
    </header>

    <div class="mysql-info">
      <strong id="szemelyekSzam">📊 Betöltés...</strong>
    </div>

    <div class="form-section">
      <h2 style="margin-bottom: 20px; color: #333">➕ Új személy</h2>
      <form id="ujSzemely" class="form-grid">
        <input name="nev" placeholder="Név *" required />
        <input name="email" type="email" placeholder="Email *" required />
        <input name="telefon" placeholder="Telefon *" required />
        <input name="anyja_neve" placeholder="Anyja neve *" required />
        <input name="igazolvany_szam" placeholder="Igazolvány szám *" required />
        <button type="submit">💾 Hozzáadás</button>
      </form>
    </div>

    <div class="table-section">
      <h2 style="margin-bottom: 20px; color: #333">📋 Személyek listája</h2>
      <div id="loading" class="loading">Betöltés...</div>
      <table id="szemelyekTabla" style="display: none">
        <thead>
          <tr>
            <th>ID</th>
            <th>Név</th>
            <th>Email</th>
            <th>Telefon</th>
            <th>Anyja neve</th>
            <th>Igazolvány</th>
            <th>🔧</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <script>
    let szemelyek = [];

    async function betoltLista() {
      try {
        const res = await fetch('/api/szemelyek');
        const data = await res.json();

        // ✅ BIZTOSAN TÖMB!
        szemelyek = Array.isArray(data) ? data : [];

        document.getElementById(
          'szemelyekSzam'
        ).textContent = `📊 Személyek: ${szemelyek.length}`;

        const tbody = document.querySelector('#szemelyekTabla tbody');
        tbody.innerHTML = szemelyek
          .map(
            (s) => `
                    <tr>
                        <td>${s.id || ''}</td>
                        <td contenteditable data-field="nev">${s.nev || ''}</td>
                        <td contenteditable data-field="email">${s.email || ''
              }</td>
                        <td contenteditable data-field="telefon">${s.telefon || ''
              }</td>
                        <td contenteditable data-field="anyja_neve">${s.anyja_neve || ''
              }</td>
                        <td contenteditable data-field="igazolvany_szam">${s.igazolvany_szam || ''
              }</td>
                        <td>
                            <button onclick="frissit(${s.id || 0})">💾</button>
                            <button class="delete-btn" onclick="torol(${s.id || 0
              })">🗑️</button>
                        </td>
                    </tr>
                `
          )
          .join('');

        document.getElementById('loading').style.display = 'none';
        document.getElementById('szemelyekTabla').style.display = 'table';
      } catch (error) {
        console.error('API Hiba:', error);
        document.getElementById('loading').textContent =
          '❌ API kapcsolat hiba';
        szemelyek = [];
      }
    }

    // ➕ HOZZÁADÁS
    document
      .getElementById('ujSzemely')
      .addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        try {
          await fetch('/api/szemelyek', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(Object.fromEntries(formData)),
          });
          e.target.reset();
          betoltLista();
        } catch (error) {
          alert('❌ Hozzáadás hiba!');
        }
      });

    // 💾 FRISSÍTÉS
    window.frissit = async (id) => {
      const sor = event.target.closest('tr');
      const data = {
        nev: sor.querySelector('[data-field="nev"]').textContent,
        email: sor.querySelector('[data-field="email"]').textContent,
        telefon: sor.querySelector('[data-field="telefon"]').textContent,
        anyja_neve: sor.querySelector('[data-field="anyja_neve"]')
          .textContent,
        igazolvany_szam: sor.querySelector('[data-field="igazolvany_szam"]')
          .textContent,
      };

      try {
        await fetch(`/api/szemelyek/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        });
        betoltLista();
      } catch (error) {
        alert('❌ Frissítés hiba!');
      }
    };

    // 🗑️ TÖRLÉS
    window.torol = async (id) => {
      if (confirm('Biztosan töröljük?')) {
        try {
          await fetch(`/api/szemelyek/${id}`, {
            method: 'DELETE',
          });
          betoltLista();
        } catch (error) {
          alert('❌ Törlés hiba!');
        }
      }
    };

    // START
    betoltLista();
  </script>
</body>

</html>
