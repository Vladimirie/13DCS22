<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<link rel="stylesheet" href="./css/style.css">
	<title>Document</title>
</head>
<body>
	<h1 class="head">Person database</h1>
	<div class="card">
		<h2>View and edit people</h3>
		<select id="people">
		</select>
		<div class="forminput">
			<input type="hidden" id="edit_id">
			<input type="text" id="f_name" placeholder="Név" readonly>
			<input type="text" id="f_email" placeholder="E-Mail" readonly>
			<input type="text" id="f_phone" placeholder="Tel. szám" readonly>
			<input type="text" id="f_mother" placeholder="Anyja neve" readonly>
			<input type="text" id="f_idnum" placeholder="Igazolványszám" readonly>
		</div>
		<div>
			<button type="button" id="refresh_table">Refresh</button>
			<button type="button" id="clear">Clear</button>
		</div>
	</div>
	<div class="card">
		<table>
			<thead>
				<tr>
					<th>Name</th>
					<th>E-Mail</th>
					<th>Phone number</th>
					<th>Mother's name</th>
					<th>I.D. number</th>
				</tr>
			</thead>
			<tbody id="datatable"></tbody>
		</table>
	</div>
	<script src="./js/script.js"></script>
</body>
</html>
