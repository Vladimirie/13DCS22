<html lang="en">
<head>

    <title>Document</title>
</head>
<body>
    
<div id="app">
<h1>{{uzenet}}</h1>
<div class="container text-center">
  <div class="row">
    <div class="col">
<div class="card" style="width: 18rem;">
  <img src="../git/13DCS22/Kiss-Fodor Zsombor/zámbó jimmy giffek/1309100212_26.gif" class="card-img-top" alt="...">
  <div class="card-body">
    <h5 class="card-title">REF</h5>
    <p class="card-text">    <form action="">
        <input v-model="szmezo" type="text" value="f">
        <label for="">{{szmezo}}</label>
        <input v-model="szmezo" type="text" value="f">
    </form></p>
    
  </div>
</div>
    </div>
    <div class="col">
   <div class="card" style="width: 18rem;">

  <div class="card-body">
     <h5 class="card-title">A Gomb</h5>
    <p class="card-text"><button style="width: 10vh; height: 10vh;" @click="count++" >{{count}} </button></p>
  </div>
</div>
    </div>
    <div class="col">
        
        <h3><button @click="additem">>Hozzáad</button></h3>
        <ul >
            <li v-for="(item, index) of items" :key="index">  {{item}} {{index}} </li>
        </ul>


    </div>
  </div>
</div>









</div>
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script>
const {createApp, ref} = Vue
try {
createApp({
    setup() {
        const szmezo = ref('');

        const count = ref(0);


        const items = ref(['Első elem', 'pablo', 'harmadik elem']); //Valamiért csak az elsó elem lesz deklarálva
       
        const additem = () => {
                items.value.push(`Lista elem #${items.value.length + 1}`);
            
        };
         return {
            szmezo, 
            count,
            items,
            additem
        
         }
    },


    data() {
        return {
            uzenet: 'szia Vue'
        }
    }
}).mount('#app');
} catch (err) {
    console.log(err)
}
</script>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
